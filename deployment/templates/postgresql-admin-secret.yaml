{{- if and (not .Values.postgresql.enabled) .Values.postgresql.createDatabaseJob.enabled (not .Values.postgresql.createDatabaseJob.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fusion-forge.pgAdminSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgresql.createDatabaseJob.admin.password (or admin.existingSecret) is required when postgresql.createDatabaseJob.enabled is true" .Values.postgresql.createDatabaseJob.admin.password | quote }}
{{- end }}
