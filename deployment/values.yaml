# =============================================================================
# fusion-forge — Helm Values
# =============================================================================

# -----------------------------------------------------------------------------
# Builder images — maps builder-image keys to container image references.
# Keys for requirements/git builds are python_version strings ("3.12", "3.10").
# Keys for app builds are the builderImage field from the repository's metadata.yaml.
# Add entries here to support additional builder images; the server reads this map
# from the fusion-forge-builder-images ConfigMap at startup.
# -----------------------------------------------------------------------------
builderImages:
  "3.12": "fusion-venv-builder:local"
  "python3.12": "fusion-venv-builder:local"
  "3.10": "fusion-venv-builder-py310:local"
  "python3.10": "fusion-venv-builder-py310:local"

# Set to false if the namespace already exists (e.g. installed by another chart)
createNamespace: false

# Image pull secrets applied to server, operator, and postgresql pods.
# Builder Job pods inherit the secret via the fusion-forge-builder ServiceAccount.
# Example:
#   imagePullSecrets:
#     - name: my-registry-secret
imagePullSecrets: []

# -----------------------------------------------------------------------------
# Server — REST API (cmd/server, port 8080)
# -----------------------------------------------------------------------------
server:
  image:
    repository: fusion-forge
    tag: "local"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi

  # Pod-level security context (spec.securityContext).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  # Container-level security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  # Extra labels/annotations on the Deployment object (not pods).
  deploymentLabels: {}
  deploymentAnnotations: {}

  # Extra labels/annotations on every pod.
  podLabels: {}
  podAnnotations: {}

  # Node scheduling constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  config:
    # fusion-index base URL.
    indexBackendURL: http://fusion-index-backend.fusion.svc.cluster.local:8080
    # Set to "true" to require K8s SA bearer token auth on all /api/v1/** endpoints.
    authEnabled: "false"
    # If non-empty, the bearer token must have been issued for this audience.
    authAudience: ""
    # Comma-separated namespace/name list of allowed service accounts. Empty = any valid SA.
    authAllowedSAs: ""
    # Log level: debug | info | warn | error
    logLevel: "info"
    # Log format: json | text
    logFormat: "json"

# -----------------------------------------------------------------------------
# Operator — CIBuild reconciler (cmd/operator)
# -----------------------------------------------------------------------------
operator:
  image:
    repository: fusion-forge
    tag: "local"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Pod-level security context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  # Container-level security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  # Extra labels/annotations on the Deployment object (not pods).
  deploymentLabels: {}
  deploymentAnnotations: {}

  # Extra labels/annotations on every pod.
  podLabels: {}
  podAnnotations: {}

  # Node scheduling constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Runtime configuration injected as env vars into the operator container.
  config:
    # Comma-separated KEY=VALUE labels added to every builder Job object.
    # System-managed labels (app, build ID) always take precedence.
    # Example:
    #   builderJobLabels:
    #     team: platform
    #     env: prod
    builderJobLabels: {}

    # Comma-separated KEY=VALUE annotations added to every builder Job object.
    # Example:
    #   builderJobAnnotations:
    #     prometheus.io/scrape: "false"
    builderJobAnnotations: {}

    # Comma-separated KEY=VALUE labels added to every builder Pod template.
    builderPodLabels: {}

    # Comma-separated KEY=VALUE annotations added to every builder Pod template.
    # Example:
    #   builderPodAnnotations:
    #     vault.hashicorp.com/agent-inject: "false"
    builderPodAnnotations: {}

    # Pod-level security context applied to every builder Job pod.
    # runAsUser: 0 disables explicit UID setting (uses container image default).
    # seccompProfile: omit or set type: "" to disable seccomp enforcement.
    builderPodSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

# -----------------------------------------------------------------------------
# Watcher — GitOps poller (cmd/watcher)
#
# Polls configured GitWatcher CRs and triggers builds when a new version is
# detected in pyproject.toml (git builds) or metadata.yaml (app builds).
# -----------------------------------------------------------------------------
watcher:
  image:
    repository: fusion-forge
    tag: "local"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Pod-level security context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  # Container-level security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  # Extra labels/annotations on the Deployment object (not pods).
  deploymentLabels: {}
  deploymentAnnotations: {}

  # Extra labels/annotations on every pod.
  podLabels: {}
  podAnnotations: {}

  # Node scheduling constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  config:
    # fusion-index base URL (must match server.config.indexBackendURL).
    indexBackendURL: http://fusion-index-backend.fusion.svc.cluster.local:8080
    # How often to poll each watched repository (seconds).
    pollInterval: "60"
    # Number of consecutive build failures before a watcher is auto-disabled.
    maxFailures: "2"

# -----------------------------------------------------------------------------
# Linkerd service mesh integration
#
# builderInject: controls the linkerd.io/inject annotation on builder Job pods.
#
# This is a Job-COMPLETION concern, not an upload fix.
# Large upload failures (builder → fusion-index) must be fixed by setting
# linkerd.opaquePorts: "8080" in the fusion-index Helm chart — that keeps
# full Linkerd mTLS and observability while switching the tunnel to TCP.
#
# The Job-completion problem: when a namespace has automatic Linkerd injection
# the sidecar keeps running after the build binary exits, so the Job never
# reaches Completed and hangs indefinitely.
#
#   "disabled" — skip sidecar injection on builder Jobs. Loses mTLS and
#                Linkerd metrics for builds. Only use if native sidecar
#                support (K8s 1.29+) or linkerd-await is not available.
#   ""         — use the namespace default (no annotation added).
# -----------------------------------------------------------------------------
linkerd:
  builderInject: ""   # "disabled" | "" (namespace default)

# -----------------------------------------------------------------------------
# Authentication — K8s SA TokenReview
#
# When enabled the server calls the cluster TokenReview API to validate every
# request to /api/v1/**. Health probes are always public.
# Requires a ClusterRole allowing tokenreviews (provisioned automatically).
# -----------------------------------------------------------------------------
auth:
  enabled: false

  # If non-empty, the bearer token must have been issued for this audience.
  audience: ""

  # Whitelist of service accounts allowed to call the API.
  # Format: "namespace/name". Empty list = any valid SA token is accepted.
  # Example:
  #   allowedServiceAccounts:
  #     - fusion/fusion-spectra
  allowedServiceAccounts: []

# -----------------------------------------------------------------------------
# PostgreSQL — embedded StatefulSet or external
#
# Bundled (default):  postgresql.enabled: true
# External:           postgresql.enabled: false  +  postgresql.external.*
# -----------------------------------------------------------------------------
postgresql:
  enabled: true

  auth:
    database: fusion_forge
    username: fusion
    password: "fusion"          # override in production — or use existingSecret
    existingSecret: ""          # if set, password above is ignored; key must be "password"

  persistence:
    enabled: true
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Pod-level security context for the PostgreSQL pod.
  # postgres:16-alpine runs as UID 70 (user "postgres").
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    fsGroup: 70

  # Container-level security context for PostgreSQL.
  # readOnlyRootFilesystem is intentionally omitted — postgres writes lock files to /var/run/postgresql.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # Extra labels/annotations on the StatefulSet object (not pods).
  statefulsetLabels: {}
  statefulsetAnnotations: {}

  # Extra labels/annotations on every pod.
  podLabels: {}
  podAnnotations: {}

  # Node scheduling constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # External PostgreSQL — only used when enabled: false
  external:
    host: ""
    port: 5432
    database: fusion_forge
    username: fusion
    existingSecret: ""          # must contain key "password"
    password: ""                # prefer existingSecret in production

  # ---------------------------------------------------------------------------
  # One-time database creation — external server only (postgresql.enabled: false).
  # Runs as a Helm pre-install,pre-upgrade hook Job that creates the target
  # database (idempotent) before the main Deployment is applied. It does NOT
  # create tables — schema migrations are applied by the fusion-forge server
  # binary itself on startup (internal/db/db.go, golang-migrate). Bundled mode
  # (postgresql.enabled: true) never needs this — the postgres image's
  # POSTGRES_DB env var creates the database on first boot.
  #
  # admin.* is a separate CREATEDB-privileged identity, distinct from
  # postgresql.external.username/password above (the app's own runtime user,
  # which may be unprivileged once the database already exists).
  # ---------------------------------------------------------------------------
  createDatabaseJob:
    enabled: false
    image: postgres:16-alpine
    activeDeadlineSeconds: 120
    # postgres:16-alpine runs as UID 70 (user "postgres") — matches the bundled
    # StatefulSet convention. Only the psql client is used (non-interactive -c
    # mode), so readOnlyRootFilesystem is safe with no extra volumes.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    admin:
      username: postgres           # must have CREATEDB privilege on external.host
      password: ""                 # fallback when existingSecret is empty (dev only) —
                                    # chart then creates its own Secret named
                                    # <release>-postgresql-admin-secret
      existingSecret: ""           # name of a pre-existing Secret holding the password above
      existingSecretKey: "password"

# -----------------------------------------------------------------------------
# Ingress (optional)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: forge.fusion.local
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    enabled: false
    secretName: fusion-forge-tls
